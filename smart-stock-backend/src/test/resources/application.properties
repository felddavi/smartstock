# Configuracao Exclusiva para Testes Automatizados (H2 em Memoria)
# Garante isolamento total do banco de dados de producao/desenvolvimento (MySQL)
spring.application.name=smart-stock-backend-test

# Banco de Dados H2 em Memoria simulando MySQL
spring.datasource.url=jdbc:h2:mem:smartstock_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
